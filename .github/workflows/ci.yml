name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Install ffmpeg for the test fixtures
        run: command -v ffmpeg || sudo apt-get install -y ffmpeg
      - run: make test
      - run: make test-container
        env:
          CONTAINER_ENGINE: docker
