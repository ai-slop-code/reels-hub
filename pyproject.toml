[project]
name = "reels-hub"
version = "0.0.0"
description = "Reels Hub: local central intelligence for Katarina's Reels"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "xxhash>=4.1.0",
]

[project.scripts]
reels-hub = "reels_hub.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Copied as is from the handoff repo; linted when it is wrapped in phase 7.
extend-exclude = ["tools/mkmap.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not container'"
markers = [
    "real: runs a real engine on a small fixture (skipped in CI)",
    "container: runs inside the built image",
]
